name: Build

on:
  push:
    branches:
      - master
      - main
      - dev
      - 'feature/**'
    tags:
      - '*'
  pull_request:
    branches: [master, main, dev]

jobs:
  windows-x86_64:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: |
        cmake -B ${{github.workspace}}/build -A x64
        cmake --build ${{github.workspace}}/build --config Release
    - name: Test
      run: ctest -C Release --output-on-failure
      working-directory: ${{github.workspace}}/build
    - name: Upload windows x86_64 build
      uses: actions/upload-artifact@v4
      with:
        name: windows_x86_64
        path: ${{github.workspace}}/build/Analyzers/Release/*.dll
  windows-arm64:
    runs-on: windows-11-arm
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: |
        cmake -B ${{github.workspace}}/build -A ARM64
        cmake --build ${{github.workspace}}/build --config Release
    - name: Test
      run: ctest -C Release --output-on-failure
      working-directory: ${{github.workspace}}/build
    - name: Upload windows arm64 build
      uses: actions/upload-artifact@v4
      with:
        name: windows_arm64
        path: ${{github.workspace}}/build/Analyzers/Release/*.dll
  macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: |
        cmake -B ${{github.workspace}}/build/x86_64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
        cmake --build ${{github.workspace}}/build/x86_64
        cmake -B ${{github.workspace}}/build/arm64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
        cmake --build ${{github.workspace}}/build/arm64
    - name: Test (native arm64)
      run: ctest --output-on-failure
      working-directory: ${{github.workspace}}/build/arm64
    - name: Upload MacOS x86_64 build
      uses: actions/upload-artifact@v4
      with:
        name: macos_x86_64
        path: ${{github.workspace}}/build/x86_64/Analyzers/*.so
    - name: Upload MacOS arm64 build
      uses: actions/upload-artifact@v4
      with:
        name: macos_arm64
        path: ${{github.workspace}}/build/arm64/Analyzers/*.so
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Pull pre-built builder image
      run: docker pull ghcr.io/saleae/analyzer-build-image:linux-x86_64
    - name: Build inside container
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/app \
          -w /app \
          ghcr.io/saleae/analyzer-build-image:linux-x86_64 \
          bash -c 'cmake -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build && cd build && ctest --output-on-failure'
    - name: Upload Linux x86_64 build
      uses: actions/upload-artifact@v4
      with:
        name: linux_x86_64
        path: ${{github.workspace}}/build/Analyzers/*.so
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v4
    - name: Pull pre-built builder image
      run: docker pull ghcr.io/saleae/analyzer-build-image:linux-arm64
    - name: Build inside container
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/app \
          -w /app \
          ghcr.io/saleae/analyzer-build-image:linux-arm64 \
          bash -c 'cmake -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build && cd build && ctest --output-on-failure'
    - name: Upload Linux arm64 build
      uses: actions/upload-artifact@v4
      with:
        name: linux_arm64
        path: ${{github.workspace}}/build/Analyzers/*.so
  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install LLVM tools
      run: sudo apt-get update && sudo apt-get install -y llvm jq
    - name: Build instrumented tests
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Debug -DQSPI_COVERAGE=ON \
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
        cmake --build build --target qspi_tests
    - name: Run tests
      run: LLVM_PROFILE_FILE=qspi.profraw ./build/bin/qspi_tests
    - name: Enforce 100% line and branch coverage
      run: |
        llvm-profdata merge -sparse qspi.profraw -o qspi.profdata
        llvm-cov report ./build/bin/qspi_tests -instr-profile=qspi.profdata src/*.cpp
        SUMMARY=$(llvm-cov export ./build/bin/qspi_tests -instr-profile=qspi.profdata -summary-only src/*.cpp)
        LINES=$(echo "$SUMMARY" | jq '.data[0].totals.lines.percent')
        BRANCHES=$(echo "$SUMMARY" | jq '.data[0].totals.branches.percent')
        echo "line coverage: $LINES%  branch coverage: $BRANCHES%"
        test "$(echo "$SUMMARY" | jq '.data[0].totals.lines.percent >= 100 and .data[0].totals.branches.percent >= 100')" = "true"
  publish:
    needs: [windows-x86_64, windows-arm64, macos, linux-x86_64, linux-arm64, coverage]
    runs-on: ubuntu-latest
    steps:
    - name: download individual builds
      uses: actions/download-artifact@v4
      with:
        path: ${{github.workspace}}/artifacts
    - name: zip
      run: |
        cd ${{github.workspace}}/artifacts
        zip -r ${{github.workspace}}/analyzer.zip .
    - uses: actions/upload-artifact@v4
      with:
        name: all-platforms
        path: ${{github.workspace}}/artifacts/**
    - name: create release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
          files: ${{github.workspace}}/analyzer.zip
